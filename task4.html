<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Task 4 - Table and Form</title>
        <link rel="stylesheet" href="style4.css">
    </head>
    <body>
        <div class="navbar">
            <a href="index.html">Task 1 Profile</a>
            <a href="task2.html">Task 2 Layout</a>
            <a href="task3.html">Task 3 Tribute</a>
            <a href="task4.html">Task 4 Table</a>
            <a href="midterm.html">Task 5</a>
        </div>
        
        <h1 id="table-heading">Student Grades</h1>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Subject</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Bogdat Batyrkhan</td>
                    <td>Web Development</td>
                    <td>A</td>
                </tr>
                <tr class="highlight-row">
                    <td>Bogdat Adilkhan</td>
                    <td>Database Design</td>
                    <td>B+</td>
                </tr>
                <tr>
                    <td>Bogdat Alikhan</td>
                    <td>Mathematics</td>
                    <td>A-</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2" class="total-label">Average</td>
                    <td><strong>A-</strong></td>
                </tr>
            </tfoot>
        </table>
            
        <hr class="divider">
        <div id="form-wrapper">
            <h2>Feedback Form</h2>
            <form action="#" method="get">
                <label for="username">Name:</label>
                <input type="text" id="username" name="username" class="input-field" placeholder="Enter your name" required>
                
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" class="input-field" placeholder="Enter your email" required>
                
                <label for="role">Your Role:</label>
                <select id="role" name="role" class="input-field">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="other">Other</option>
                </select>
                
                <label>Did you like this assignment?</label>
                <div class="radio-group">
                    <input type="radio" id="yes" name="liked_task" value="yes" checked>
                    <label for="yes" class="radio-label">Yes</label>
            
                    <input type="radio" id="no" name="liked_task" value="no">
                    <label for="no" class="radio-label">No</label>
                </div>
                
                <label for="comments">Comments:</label>
                <textarea id="comments" name="comments" class="input-field" rows="4" placeholder="Write your feedback here..."></textarea>
                
                <input type="submit" value="Submit Feedback" class="submit-btn">
            </form>
        </div>
    </body>
</html>
